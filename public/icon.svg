<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="50%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Golden border outline -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#ffca28" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Card suits cluster -->
  <g transform="translate(256, 210)" filter="url(#shadow)">
    <!-- White card base -->
    <rect x="-110" y="-110" width="220" height="220" rx="36" fill="#ffffff"/>
    
    <!-- Suits in 4 quadrants -->
    <text x="-48" y="-30" font-size="64" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="sans-serif">♠</text>
    <text x="48" y="-30" font-size="64" font-weight="bold" fill="#dc2626" text-anchor="middle" font-family="sans-serif">♥</text>
    <text x="-48" y="66" font-size="64" font-weight="bold" fill="#dc2626" text-anchor="middle" font-family="sans-serif">♦</text>
    <text x="48" y="66" font-size="64" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="sans-serif">♣</text>
  </g>

  <!-- Crown on top of card -->
  <g transform="translate(256, 85)">
    <path d="M -45 15 L -60 -25 L -20 -5 L 0 -35 L 20 -5 L 60 -25 L 45 15 Z" fill="#ffca28" stroke="#ffe082" stroke-width="4"/>
    <circle cx="-60" cy="-25" r="5" fill="#ffffff"/>
    <circle cx="0" cy="-35" r="6" fill="#ffffff"/>
    <circle cx="60" cy="-25" r="5" fill="#ffffff"/>
  </g>

  <!-- Text at bottom -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MARRIAGE</text>
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffca28" text-anchor="middle" letter-spacing="4">POINT CALCULATOR</text>
</svg>
